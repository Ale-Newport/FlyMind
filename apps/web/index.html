<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FlyMind: connectome-constrained Drosophila brain simulation, embodied virtual fly and 3D brain explorer." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>FlyMind</title>
    <script>
      // Resolve the colour theme before first paint (no flash). Keep in sync with src/lib/theme.ts:
      // preference ("system" | "light" | "dark") lives in localStorage["flymind-theme"].
      (function () {
        var pref = null;
        try { pref = window.localStorage.getItem("flymind-theme"); } catch (e) { /* storage blocked */ }
        var dark = true;
        try { dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { /* ignore */ }
        var theme = pref === "light" || pref === "dark" ? pref : dark ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
