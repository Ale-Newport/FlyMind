name: Bug report
description: Something in FlyMind is broken or gives a wrong result.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/Ale-Newport/FlyMind/issues) first.
        **Security problems:** do not open a public issue; use [private vulnerability reporting](https://github.com/Ale-Newport/FlyMind/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Brain Simulator
        - Virtual Fly (walking / flight)
        - Brain Explorer 3D
        - Experiments / reproducibility
        - Data import (FlyWire / Codex / Zenodo)
        - CLI / Makefile / installation
        - Web demo (GitHub Pages)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, dataset (`synthetic_demo_v1`, `flywire_fafb_783`, ...) and settings. An experiment `spec.json` is ideal.
      placeholder: |
        1. make setup
        2. uv run flymind sim run --dataset synthetic_demo_v1 --group grn_sugar
        3. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste the output of `make doctor` (or `uv run flymind doctor`).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: API log lines, browser console errors, or a screenshot.
