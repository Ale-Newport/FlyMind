name: GitHub Pages (static demo + docs)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv python install 3.13 && uv sync --frozen --group docs
      - name: Export the SYNTHETIC demo dataset (no FlyWire data is published)
        run: uv run python scripts/data/export_static_demo.py
      - run: npm ci && npm run build:pages
        working-directory: apps/web
      - name: Build documentation into /docs
        run: uv run --group docs mkdocs build --site-dir apps/web/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
