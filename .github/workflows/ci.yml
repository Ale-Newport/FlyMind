name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Headless OpenGL (EGL, Mesa software rendering) for MuJoCo vision
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgl1 libgles2
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
          echo "PYOPENGL_PLATFORM=egl" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests (fixture only; full-data tests are skipped without the dataset)
        run: |
          set -o pipefail
          uv run pytest -m "not fulldata" --timeout=600 -ra --color=no 2>&1 | tee pytest.log
      - name: Publish failure details as an annotation
        if: failure()
        run: bash scripts/ci/annotate_failure.sh pytest.log "pytest on ${{ matrix.os }}" 80

  web:
    name: Web (type check, unit, e2e)
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Headless OpenGL for MuJoCo
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgl1 libgles2
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
          echo "PYOPENGL_PLATFORM=egl" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv python install 3.13 && uv sync --frozen
      - run: npm ci
        working-directory: apps/web
      - name: Type check and unit tests
        working-directory: apps/web
        run: |
          set -o pipefail
          (npx tsc -b && npm test) 2>&1 | tee ../../web-unit.log
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright end-to-end (Chromium)
        working-directory: apps/web
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee ../../e2e.log
      - name: Publish failure details as an annotation
        if: failure()
        run: |
          bash scripts/ci/annotate_failure.sh web-unit.log "type check / unit tests" 60
          bash scripts/ci/annotate_failure.sh e2e.log "Playwright e2e" 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: apps/web/test-results
